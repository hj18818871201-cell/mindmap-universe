services:
  mindmap-universe:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      MEDIA_ROOT: /data/media
      TTS_PROVIDER: siliconflow
    ports:
      - "80:3001"
    volumes:
      - generated-media:/data/media

volumes:
  generated-media:
